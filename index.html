<style>
:root{--primary:#4a8fff;--accent:#e11d48;--bg:#f8fafc;--border:#e2e8f0;--text:#0f172a}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;padding-bottom:160px}h1{text-align:center;font-size:1.3rem;color:var(--primary);margin:8px 0 18px}.section-title{background:var(--primary);color:white;padding:8px 12px;border-radius:4px;margin-top:20px;font-size:.95rem;font-weight:bold}.section-note{font-size:.78rem;color:#64748b;margin:6px 2px}.item-card{background:#fff;border:1px solid var(--border);padding:10px;border-radius:6px;margin-top:8px}.item-main{display:flex;justify-content:space-between;align-items:center;gap:10px}.item-info{flex:1;min-width:0}.item-name{font-weight:bold;font-size:.88rem;line-height:1.45}.item-price{font-size:.8rem;color:#64748b;margin-top:3px}.item-limit{font-size:.72rem;color:#b45309;margin-top:3px}.counter{display:flex;align-items:center;gap:6px;flex-shrink:0}.counter button{width:28px;height:28px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;font-weight:bold;cursor:pointer}.counter input{width:42px;text-align:center;border:1px solid #cbd5e1;border-radius:4px;padding:5px;font-size:.9rem}.char-toggle-btn{margin-top:5px;background:#f1f5f9;border:1px solid var(--primary);color:var(--primary);font-size:.75rem;padding:5px 8px;border-radius:4px;cursor:pointer;font-weight:bold}.char-list{display:none;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed #cbd5e1}.char-list.open{display:grid}.char-item{background:#f8fafc;padding:6px;border-radius:4px;border:1px solid #e2e8f0;display:flex;flex-direction:column;gap:4px}.char-name-label{font-size:.75rem;font-weight:bold}.footer-bar{position:fixed;bottom:0;left:0;right:0;background:#4a8fff;color:#fff;padding:10px 14px 12px;box-shadow:0 -2px 10px #0003;z-index:1000}.footer-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.footer-btns{display:flex;gap:6px;align-items:center}.total-price-text{font-size:1.15rem;font-weight:bold}.bonus-box{margin-top:6px;padding-top:6px;border-top:1px solid #ffffff70;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:#ffea00}.next-bonus{font-size:.75rem;color:#fff}.cart-btn,.download-btn,.reset-btn{color:#fff;border:0;padding:8px 10px;font-size:.75rem;font-weight:bold;border-radius:20px;cursor:pointer;white-space:nowrap}.cart-btn{background:#218838}.download-btn{background:#e11d48}.reset-btn{background:#475569}.modal-overlay{display:none;position:fixed;inset:0;background:#0009;z-index:2000;justify-content:center;align-items:center;padding:12px}.modal-overlay.open{display:flex}.modal-content{background:#fff;width:100%;max-width:500px;max-height:82vh;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.modal-header{background:var(--primary);color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.modal-header h2{margin:0;font-size:1.05rem}.close-btn{background:none;border:0;color:#fff;font-size:1.2rem;cursor:pointer}#cart-modal-body{padding:12px;overflow-y:auto;flex:1}.cart-check-item{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #eee;gap:10px}.cart-check-item.done{background:#f0f0f0;opacity:.5}.cart-check-item.done .cart-item-title{text-decoration:line-through}.cart-item-info{flex:1}.cart-item-title{font-size:.88rem;font-weight:bold}.cart-item-sub{font-size:.8rem;color:#666}.cart-checkbox{width:22px;height:22px;cursor:pointer}.modal-footer{padding:10px;text-align:center;border-top:1px solid #eee;background:#f9f9f9}.close-modal-btn{background:#666;color:white;border:0;padding:8px 20px;border-radius:20px;font-weight:bold;cursor:pointer}.creator{margin-top:30px;padding:12px 15px;background:#fff;border-radius:8px;border:1px solid var(--border);font-size:.85rem;color:#555;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:15px}.creator a{color:var(--primary);text-decoration:none;font-weight:bold}#summary-card{display:none;width:500px;background:#fff;padding:20px;border-radius:12px;border:2px solid #1e293b;font-family:Arial,sans-serif;color:#0f172a;position:fixed;top:-9999px;left:-9999px}#summary-card h2{margin:0 0 10px;font-size:1.1rem;text-align:center;border-bottom:2px dashed #1e293b;padding-bottom:8px}.summary-group-hdr{background:#1e293b;color:#fff;padding:4px 8px;font-size:.85rem;font-weight:bold;margin-top:10px;border-radius:3px}.summary-table{width:100%;border-collapse:collapse;margin-bottom:8px}.summary-table td{padding:5px 6px;font-size:.8rem;border-bottom:1px dashed #eee}.summary-table td.qty,.summary-table td.subtotal{text-align:right}.summary-total-box{background:#0f172a;color:#fff;padding:12px 15px;border-radius:8px;margin-top:15px}.summary-total-row,.summary-bonus-row{display:flex;justify-content:space-between}.summary-total-row{font-size:1.1rem;font-weight:bold;margin-bottom:5px}.summary-bonus-row{font-size:.85rem;color:#fde047;border-top:1px solid #334155;padding-top:5px}.accordion-list{display:none;margin-top:8px}.accordion-list.open{display:block}.group-toggle-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f1f5f9;border:1px solid var(--primary);color:var(--primary);padding:10px;border-radius:5px;font-size:.85rem;font-weight:bold;cursor:pointer;text-align:left}.group-toggle-btn .toggle-mark{font-size:1.1rem;flex-shrink:0}.accordion-list .item-card{margin-top:8px}.sold-out-note{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:8px 10px;border-radius:6px;font-size:.8rem;margin-top:8px}
@media(max-width:380px){body{padding:10px;padding-bottom:155px}.footer-bar{padding:8px}.footer-btns{gap:4px}.cart-btn,.download-btn,.reset-btn{padding:7px 8px;font-size:.68rem}.total-price-text{font-size:1rem}}
</style></head><body>
<h1>スタマイ×AGF2026<br>グッズ購入シミュレーター</h1>
<div class="section-title">【オープン商品】</div><div class=<div id="char-items"></div><div id="open-items"></div>
<div class="section-title">【ランダム商品／10パックセット】</div><div id="set-items"></div>
<div class="section-title">【ランダム商品／バラ売り】</div><div class="sold-out-note">※AGF会場での販売はなし</div><div id="single-items"></div>
<div id="summary-card"><h2>スタマイ×AGF2026 購入リスト</h2><div id="summary-content"></div><div class="summary-total-box"><div class="summary-total-row"><span>合計金額</span><span id="summary-total-price">¥0</span></div><div class="summary-bonus-row"><span>🎁 購入特典（3,000円ごと）</span><span><strong id="summary-bonus-count">0</strong> 枚</span></div></div></div>
<div class="creator"><a href="https://twitter.com/intent/tweet?text=スタマイ×AGF2026 グッズ購入シミュレーター%0Ahttps://ylocal-trhk.github.io/stmy_agf2026/" target="_blank" rel="noopener">シェア</a><div>作成者：<a href="https://x.com/yLocal_trhk" target="_blank" rel="noopener">@yLocal_trhk</a></div><div><a href="https://ylocal-trhk.github.io/HOME/">← HOMEに戻る</a></div></div>
<div class="footer-bar"><div class="footer-row"><div><span style="font-size:.75rem">合計金額</span><br><span id="total-price" class="total-price-text">¥0</span></div><div class="footer-btns"><button class="cart-btn" onclick="openCartModal()">List(<span id="cart-count">0</span>)</button><button class="reset-btn" onclick="resetAll()">Reset</button><button class="download-btn" onclick="generateImage()">画像で保存</button></div></div><div class="bonus-box"><div>🎁 購入特典: <strong id="bonus-count">0</strong> 枚(3,000円毎) <span id="next-bonus" class="next-bonus">（あと ¥3,000）</span></div></div></div>
<div id="cart-modal" class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>🛒 購入チェックリスト</h2><button class="close-btn" onclick="closeCartModal()">✕</button></div><div id="cart-modal-body"></div><div class="modal-footer"><button class="close-modal-btn" onclick="closeCartModal()">閉じる</button></div></div></div>
<script>
const STORAGE_KEY='stmy_agf2026_goods_selection';const CHECK_KEY='stmy_agf2026_checked_keys';
let checkedItemKeys=new Set(JSON.parse(localStorage.getItem(CHECK_KEY)||'[]'));
const charList=['青山','由井','関','夏目','今大路','渡部','朝霧','菅野','荒木田','服部','桧山','大谷','神楽','槙','誠','京介','新堂','カナメ','桐嶋','九条','宮瀬','可愛','宝生','日向','早乙女','瀬尾'];
const itemsData={chars:[{name:'アクスタ',price:2420,limit:3}],open:[{name:'マトリ・都築兄弟',price:3000,limit:3},{name:'警視庁・九条家',price:3300,limit:3},{name:'Revel・瀬尾研究室',price:3300,limit:3},{name:'2027卓上カレンダー',price:1900,limit:3}],sets:[{name:'缶バッジ',price:5500,limit:3},{name:'トレカ（2枚入）',price:5500,limit:3}],singles:[{name:'缶バッジ',price:550},{name:'トレカ（2枚入）',price:550}]};
function card(item,cat,i,sub=''){const id=`${cat}-${i}`;if(cat==='chars'){const inner=charList.map(c=>`<div class="char-item"><span class="char-name-label">${c}</span><div class="counter"><button onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" max="${item.limit}" data-category="${cat}" data-name="${item.name}" data-sub="${c}" data-price="${item.price}" data-limit="${item.limit}" onchange="calculateTotal()"><button onclick="updateQty(this,1)">＋</button></div></div>`).join('');return `<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-price">¥${item.price.toLocaleString()}／個</div><div class="item-limit">各キャラ上限${item.limit}点</div></div><button class="char-toggle-btn" onclick="toggleSubList('${id}')">キャラ別に選択 👤</button></div><div class="char-list" id="${id}">${inner}</div></div>`}return `<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-price">¥${item.price.toLocaleString()}${cat==='sets'?'／セット': ''}</div>${item.limit?`<div class="item-limit">上限${item.limit}${cat==='sets'?'セット':'点'}</div>`:''}</div><div class="counter"><button onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" ${item.limit?`max="${item.limit}"`:''} data-category="${cat}" data-name="${item.name}" data-price="${item.price}" ${item.limit?`data-limit="${item.limit}"`:''} onchange="calculateTotal()"><button onclick="updateQty(this,1)">＋</button></div></div></div>`}
function render(){
 document.getElementById('char-items').innerHTML=itemsData.chars.map((x,i)=>card(x,'chars',i)).join('');
 
const iroka=itemsData.open.filter(x=>x.name!=='2027卓上カレンダー');
 const calendar=itemsData.open.find(x=>x.name==='2027卓上カレンダー');
 
document.getElementById('open-items').innerHTML=`<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">イラカセット</div><div class="item-limit">各グループ上限3点</div></div><button class="char-toggle-btn" onclick="toggleSubList('iroka-list')">グループを選択</button></div><div class="accordion-list" id="iroka-list">${iroka.map((x,i)=>card(x,'open',i)).join('')}</div></div>${card(calendar,'open',3)}`;
 document.getElementById('set-items').innerHTML=itemsData.sets.map((x,i)=>card(x,'sets',i)).join('');
 document.getElementById('single-items').innerHTML=itemsData.singles.map((x,i)=>card(x,'singles',i)).join('');
 const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');document.querySelectorAll('input[data-category]').forEach(el=>{const key=getKey(el);if(saved[key]!==undefined)el.value=saved[key]});calculateTotal()
}
function toggleOpenGroup(id,button){const list=document.getElementById(id);const opened=list.classList.toggle('open');button.querySelector('.toggle-mark').textContent=opened?'−':'＋'}
function getKey(el){return [el.dataset.category,el.dataset.name,el.dataset.sub||''].join('|')}
function toggleSubList(id){document.getElementById(id).classList.toggle('open')}
function updateQty(btn,delta){const input=btn.parentElement.querySelector('input');const max=input.dataset.limit?Number(input.dataset.limit):Infinity;input.value=Math.max(0,Math.min(max,(parseInt(input.value)||0)+delta));calculateTotal()}
function calculateTotal(){let total=0,count=0,cart=[];const saved={};document.querySelectorAll('input[data-category]').forEach(el=>{let q=Math.max(0,parseInt(el.value)||0);const max=el.dataset.limit?Number(el.dataset.limit):Infinity;q=Math.min(max,q);el.value=q;const price=Number(el.dataset.price);saved[getKey(el)]=q;if(q>0){total+=q*price;count+=q;cart.push({key:getKey(el),name:el.dataset.name+(el.dataset.sub?'／'+el.dataset.sub:''),qty:q,price,subtotal:q*price})}});localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));const bonus=Math.floor(total/3000),remaining=total%3000===0?3000:3000-total%3000;document.getElementById('total-price').textContent='¥'+total.toLocaleString();document.getElementById('cart-count').textContent=count;document.getElementById('bonus-count').textContent=bonus;document.getElementById('next-bonus').textContent='（あと ¥'+remaining.toLocaleString()+'）';document.getElementById('summary-total-price').textContent='¥'+total.toLocaleString();document.getElementById('summary-bonus-count').textContent=bonus;window.currentCart=cart;renderCart();renderSummary(cart,total,bonus)}
function renderCart(){const body=document.getElementById('cart-modal-body');const cart=window.currentCart||[];if(!cart.length){body.innerHTML='<p style="text-align:center;color:#64748b">商品が選択されていません。</p>';return}body.innerHTML=cart.map(x=>`<div class="cart-check-item ${checkedItemKeys.has(x.key)?'done':''}"><input class="cart-checkbox" type="checkbox" ${checkedItemKeys.has(x.key)?'checked':''} onchange="toggleChecked('${encodeURIComponent(x.key)}',this.checked)"><div class="cart-item-info"><div class="cart-item-title">${x.name}</div><div class="cart-item-sub">${x.qty}点 × ¥${x.price.toLocaleString()} = ¥${x.subtotal.toLocaleString()}</div></div></div>`).join('')}
function toggleChecked(key,checked){key=decodeURIComponent(key);if(checked)checkedItemKeys.add(key);else checkedItemKeys.delete(key);localStorage.setItem(CHECK_KEY,JSON.stringify([...checkedItemKeys]));renderCart()}
function openCartModal(){renderCart();document.getElementById('cart-modal').classList.add('open')}function closeCartModal(){document.getElementById('cart-modal').classList.remove('open')}
function renderSummary(cart,total,bonus){const groups={};cart.forEach(x=>{const category=x.key.split('|')[0];const label={chars:'オープン商品／キャラ別',open:'オープン商品',sets:'ランダム商品／10パックセット',singles:'ランダム商品／バラ売り'}[category];(groups[label]??=[]).push(x)});document.getElementById('summary-content').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="summary-group-hdr">${g}</div><table class="summary-table">${items.map(x=>`<tr><td>${x.name}</td><td class="qty">×${x.qty}</td><td class="subtotal">¥${x.subtotal.toLocaleString()}</td></tr>`).join('')}</table>`).join('')||'<p style="text-align:center">商品未選択</p>'}
function resetAll(){if(!confirm('選択内容をすべてリセットしますか？'))return;document.querySelectorAll('input[data-category]').forEach(el=>el.value=0);checkedItemKeys.clear();localStorage.removeItem(CHECK_KEY);calculateTotal()}
async function generateImage(){const card=document.getElementById('summary-card');card.style.display='block';try{if(!window.html2canvas){alert('画像保存ライブラリの読み込みに失敗しました。通信環境を確認してください。');return}const canvas=await html2canvas(card,{scale:2,backgroundColor:'#ffffff'});const a=document.createElement('a');a.download='スタマイ_AGF2026_購入リスト.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('画像の作成に失敗しました。もう一度お試しください。')}finally{card.style.display='none'}}
render();
</script></body></html>
