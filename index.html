<style>
:root{--primary:#4a8fff;--accent:#e11d48;--bg:#f8fafc;--border:#e2e8f0;--text:#0f172a}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;padding-bottom:160px}h1{text-align:center;font-size:1.3rem;color:var(--primary);margin:8px 0 18px}.section-title{background:var(--primary);color:white;padding:8px 12px;border-radius:4px;margin-top:20px;font-size:.95rem;font-weight:bold}.section-note{font-size:.78rem;color:#64748b;margin:6px 2px}.item-card{background:#fff;border:1px solid var(--border);padding:10px;border-radius:6px;margin-top:8px}.item-main{display:flex;justify-content:space-between;align-items:center;gap:10px}.item-info{flex:1;min-width:0}.item-name{font-weight:bold;font-size:.88rem;line-height:1.45}.item-price{font-size:.8rem;color:#64748b;margin-top:3px}.item-limit{font-size:.72rem;color:#b45309;margin-top:3px}.counter{display:flex;align-items:center;gap:6px;flex-shrink:0}.counter button{width:28px;height:28px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;font-weight:bold;cursor:pointer}.counter input{width:42px;text-align:center;border:1px solid #cbd5e1;border-radius:4px;padding:5px;font-size:.9rem}.char-toggle-btn{margin-top:5px;background:#f1f5f9;border:1px solid var(--primary);color:var(--primary);font-size:.75rem;padding:5px 8px;border-radius:4px;cursor:pointer;font-weight:bold}.char-list{display:none;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed #cbd5e1}.char-list.open{display:grid}.char-item{background:#f8fafc;padding:6px;border-radius:4px;border:1px solid #e2e8f0;display:flex;flex-direction:column;gap:4px}.char-name-label{font-size:.75rem;font-weight:bold}.footer-bar{position:fixed;bottom:0;left:0;right:0;background:#4a8fff;color:#fff;padding:10px 14px 12px;box-shadow:0 -2px 10px #0003;z-index:1000}.footer-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.footer-btns{display:flex;gap:6px;align-items:center}.total-price-text{font-size:1.15rem;font-weight:bold}.bonus-box{margin-top:6px;padding-top:6px;border-top:1px solid #ffffff70;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:#ffea00}.next-bonus{font-size:.75rem;color:#fff}.cart-btn,.download-btn,.reset-btn{color:#fff;border:0;padding:8px 10px;font-size:.75rem;font-weight:bold;border-radius:20px;cursor:pointer;white-space:nowrap}.cart-btn{background:#218838}.download-btn{background:#e11d48}.reset-btn{background:#475569}.modal-overlay{display:none;position:fixed;inset:0;background:#0009;z-index:2000;justify-content:center;align-items:center;padding:12px}.modal-overlay.open{display:flex}.modal-content{background:#fff;width:100%;max-width:500px;max-height:82vh;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.modal-header{background:var(--primary);color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.modal-header h2{margin:0;font-size:1.05rem}.close-btn{background:none;border:0;color:#fff;font-size:1.2rem;cursor:pointer}#cart-modal-body{padding:12px;overflow-y:auto;flex:1}.cart-check-item{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #eee;gap:10px}.cart-check-item.done{background:#f0f0f0;opacity:.5}.cart-check-item.done .cart-item-title{text-decoration:line-through}.cart-item-info{flex:1}.cart-item-title{font-size:.88rem;font-weight:bold}.cart-item-sub{font-size:.8rem;color:#666}.cart-checkbox{width:22px;height:22px;cursor:pointer}.modal-footer{padding:10px;text-align:center;border-top:1px solid #eee;background:#f9f9f9}.close-modal-btn{background:#666;color:white;border:0;padding:8px 20px;border-radius:20px;font-weight:bold;cursor:pointer}.creator{margin-top:30px;padding:12px 15px;background:#fff;border-radius:8px;border:1px solid var(--border);font-size:.85rem;color:#555;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:15px}.creator a{color:var(--primary);text-decoration:none;font-weight:bold}#summary-card{display:none;width:500px;background:#fff;padding:20px;border-radius:12px;font-family:Arial,sans-serif;color:#0f172a;position:fixed;top:-9999px;left:-9999px}#summary-card h2{margin:0 0 10px;font-size:1.1rem;text-align:center;border-bottom:2px dashed #1e293b;padding-bottom:8px}.summary-group-hdr{background:#1e293b;color:#fff;padding:4px 8px;font-size:.85rem;font-weight:bold;margin-top:10px;border-radius:3px}.summary-table{width:100%;border-collapse:collapse;margin-bottom:8px}.summary-table td{padding:5px 6px;font-size:.8rem;border-bottom:1px dashed #eee}.summary-table td.qty,.summary-table td.subtotal{text-align:right}.summary-total-box{background:#0f172a;color:#fff;padding:12px 15px;border-radius:8px;margin-top:15px}.summary-total-row,.summary-bonus-row{display:flex;justify-content:space-between}.summary-total-row{font-size:1.1rem;font-weight:bold;margin-bottom:5px}.summary-bonus-row{font-size:.85rem;color:#fde047;border-top:1px solid #334155;padding-top:5px}.accordion-list{display:none;margin-top:8px}.accordion-list.open{display:block}.group-toggle-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f1f5f9;border:1px solid var(--primary);color:var(--primary);padding:10px;border-radius:5px;font-size:.85rem;font-weight:bold;cursor:pointer;text-align:left}.group-toggle-btn .toggle-mark{font-size:1.1rem;flex-shrink:0}.accordion-list .item-card{margin-top:8px}.random-option{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e2e8f0}.random-total{margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1;text-align:right;font-weight:bold;color:#1d4ed8;font-size:.9rem}.random-card>.item-name{font-size:1rem}.sold-out-note{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:8px 10px;border-radius:6px;font-size:.8rem;margin-top:8px}
@media(max-width:380px){body{padding:10px;padding-bottom:155px}.footer-bar{padding:8px}.footer-btns{gap:4px}.cart-btn,.download-btn,.reset-btn{padding:7px 8px;font-size:.68rem}.total-price-text{font-size:1rem}}
</style></head><body>

<h1>スタマイ×AGF2026<br>グッズ購入シミュレーター</h1>
<div class="section-title">【オープン商品】</div><div id="char-items"></div><div id="open-items"></div>
<div class="section-title">【ランダム商品】</div><div id="random-items"></div>

<div id="summary-card"><h2>スタマイ×AGF2026 購入リスト</h2><div id="summary-content"></div><div class="summary-total-box"><div class="summary-total-row"><span>合計金額</span><span id="summary-total-price">¥0</span></div><div class="summary-bonus-row"><span>🎁 購入特典（3,000円ごと）</span><span><strong id="summary-bonus-count">0</strong> 枚</span></div></div></div>
<div class="creator"><a href="https://twitter.com/intent/tweet?text=スタマイ×AGF2026 グッズ購入シミュレーター%0Ahttps://ylocal-trhk.github.io/stmy_agf2026/" target="_blank" rel="noopener">シェア</a><div>作成者：<a href="https://x.com/yLocal_trhk" target="_blank" rel="noopener">@yLocal_trhk</a></div><div><a href="https://ylocal-trhk.github.io/HOME/">← HOMEに戻る</a></div></div>
<div class="footer-bar"><div class="footer-row"><div><span style="font-size:.75rem">合計金額</span><br><span id="total-price" class="total-price-text">¥0</span></div><div class="footer-btns"><button class="cart-btn" onclick="openCartModal()">List(<span id="cart-count">0</span>)</button><button class="reset-btn" onclick="resetAll()">Reset</button><button class="download-btn" onclick="generateImage()">画像で保存</button></div></div><div class="bonus-box"><div>🎁 購入特典: <strong id="bonus-count">0</strong> 枚(3,000円毎) <span id="next-bonus" class="next-bonus">（あと ¥3,000）</span></div></div></div>
<div id="cart-modal" class="modal-overlay"><div class="modal-content"><div class="modal-header"><h2>🛒 購入チェックリスト</h2><button class="close-btn" onclick="closeCartModal()">✕</button></div><div id="cart-modal-body"></div><div class="modal-footer"><button class="close-modal-btn" onclick="closeCartModal()">閉じる</button></div></div></div>
<script>
const STORAGE_KEY='stmy_agf2026_goods_selection';const CHECK_KEY='stmy_agf2026_checked_keys';
let checkedItemKeys=new Set(JSON.parse(localStorage.getItem(CHECK_KEY)||'[]'));
const charList=['青山','由井','関','夏目','今大路','渡部','朝霧','菅野','荒木田','服部','桧山','大谷','神楽','槙','誠','京介','新堂','カナメ','桐嶋','九条','宮瀬','可愛','宝生','日向','早乙女','瀬尾'];
const itemsData={chars:[{name:'アクスタ',price:2420,limit:3}],open:[{name:'マトリ・都築兄弟',price:3000,limit:3},{name:'警視庁・九条家',price:3300,limit:3},{name:'Revel・瀬尾研究室',price:3300,limit:3},{name:'2027卓上カレンダー',price:1900,limit:3}],sets:[{name:'缶バッジ',price:5500,limit:3},{name:'トレカ（2枚入）',price:5500,limit:3}],singles:[{name:'缶バッジ',price:550},{name:'トレカ（2枚入）',price:550}]};

function card(item,cat,i,sub=''){const id=`${cat}-${i}`;if(cat==='chars'){const inner=charList.map(c=>`<div class="char-item"><span class="char-name-label">${c}</span><div class="counter"><button onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" max="${item.limit}" data-category="${cat}" data-name="${item.name}" data-sub="${c}" data-price="${item.price}" data-limit="${item.limit}" onchange="calculateTotal()"><button onclick="updateQty(this,1)">＋</button></div></div>`).join('');return `<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-price">¥${item.price.toLocaleString()}／個</div><div class="item-limit">各キャラ上限${item.limit}点</div></div><button class="char-toggle-btn" onclick="toggleSubList('${id}')">キャラ別に選択 👤</button></div>
<div class="char-list" id="${id}">${inner}</div></div>`}return `<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-price">¥${item.price.toLocaleString()}${cat==='sets'?'／セット': ''}</div>${item.limit?`<div class="item-limit">上限${item.limit}${cat==='sets'?'セット':'点'}</div>`:''}</div><div class="counter"><button onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" ${item.limit?`max="${item.limit}"`:''} data-category="${cat}" data-name="${item.name}" data-price="${item.price}" ${item.limit?`data-limit="${item.limit}"`:''} onchange="calculateTotal()"><button onclick="updateQty(this,1)">＋</button></div></div></div>`}
function renderRandomItems(){
 const names=['缶バッジ','トレカ（2枚入）'];
 document.getElementById('random-items').innerHTML=names.map((name,i)=>{
   const set=itemsData.sets.find(x=>x.name===name), single=itemsData.singles.find(x=>x.name===name);
   return `<div class="item-card random-card"><div class="item-name">${name}</div><div class="item-limit">セット・バラ売り合計で最大30個まで</div>
   <div class="random-option"><div class="item-info"><div class="item-name">10パックセット</div><div class="item-price">1セット10個分・¥5,500</div></div><div class="counter"><button onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" max="3" data-category="sets" data-name="${name}" data-price="5500" data-limit="3" data-unit="10" onchange="calculateTotal()"><button onclick="updateQty(this,1)">＋</button></div></div>
   <div class="random-option"><div class="item-info"><div class="item-name">バラ売り</div><div class="item-price">1個 ¥550</div></div><div class="counter"><button type="button" aria-label="${name} バラ売りを1個減らす" onclick="updateQty(this,-1)">−</button><input type="number" value="0" min="0" max="30" data-category="singles" data-name="${name}" data-price="550" data-limit="30" onchange="calculateTotal()"><button type="button" aria-label="${name} バラ売りを1個増やす" onclick="updateQty(this,1)">＋</button></div></div>
   <div class="random-total" id="random-total-${i}">合計：0／30個　¥0</div></div>`;
 }).join('');
}
function render(){
 document.getElementById('char-items').innerHTML=itemsData.chars.map((x,i)=>card(x,'chars',i)).join('');
 
const iroka=itemsData.open.filter(x=>x.name!=='2027卓上カレンダー');
 const calendar=itemsData.open.find(x=>x.name==='2027卓上カレンダー');
 
document.getElementById('open-items').innerHTML=`<div class="item-card"><div class="item-main"><div class="item-info"><div class="item-name">イラカセット</div><div class="item-limit">各グループ上限3点</div></div><button class="char-toggle-btn" onclick="toggleSubList('iroka-list')">グループを選択</button></div><div class="accordion-list" id="iroka-list">${iroka.map((x,i)=>card(x,'open',i)).join('')}</div></div>${card(calendar,'open',3)}`;
 renderRandomItems();
 const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');document.querySelectorAll('input[data-category]').forEach(el=>{const key=getKey(el);if(saved[key]!==undefined)el.value=saved[key]});calculateTotal()
}

function toggleOpenGroup(id,button){const list=document.getElementById(id);const opened=list.classList.toggle('open');button.querySelector('.toggle-mark').textContent=opened?'−':'＋'}
function getKey(el){return [el.dataset.category,el.dataset.name,el.dataset.sub||''].join('|')}
function toggleSubList(id){document.getElementById(id).classList.toggle('open')}
function updateQty(btn,delta){const input=btn.parentElement.querySelector('input');const max=input.dataset.limit?Number(input.dataset.limit):Infinity;input.value=Math.max(0,Math.min(max,(parseInt(input.value)||0)+delta));calculateTotal()}

function normalizeRandomQty(){
  ['缶バッジ','トレカ（2枚入）'].forEach(name=>{
    const setInput=[...document.querySelectorAll('input[data-category="sets"]')]
      .find(el=>el.dataset.name===name);
    const singleInput=[...document.querySelectorAll('input[data-category="singles"]')]
      .find(el=>el.dataset.name===name);

    if(!setInput||!singleInput)return;

    const sets=Math.max(0,Math.min(3,parseInt(setInput.value)||0));
    setInput.value=sets;

    const remaining=Math.max(0,30-sets*10);
    const singles=Math.max(0,Math.min(remaining,parseInt(singleInput.value)||0));
    singleInput.value=singles;
  });
}
function calculateTotal(){normalizeRandomQty();['缶バッジ','トレカ（2枚入）'].forEach((name,i)=>{const si=[...document.querySelectorAll('input[data-category="sets"]')].find(e=>e.dataset.name===name);const bi=[...document.querySelectorAll('input[data-category="singles"]')].find(e=>e.dataset.name===name);if(si&&bi){const qty=Number(si.value)*10+Number(bi.value);const cost=Number(si.value)*5500+Number(bi.value)*550;const el=document.getElementById('random-total-'+i);if(el)el.textContent=`合計：${qty}／30個　¥${cost.toLocaleString()}`;}});let total=0,count=0,cart=[];const saved={};document.querySelectorAll('input[data-category]').forEach(el=>{let q=Math.max(0,parseInt(el.value)||0);const max=el.dataset.limit?Number(el.dataset.limit):Infinity;q=Math.min(max,q);el.value=q;const price=Number(el.dataset.price);saved[getKey(el)]=q;if(q>0){total+=q*price;count+=q;cart.push({key:getKey(el),name:(el.dataset.category==='open'&&['マトリ・都築兄弟','警視庁・九条家','Revel・瀬尾研究室'].includes(el.dataset.name)?'イラカ／'+el.dataset.name:el.dataset.name)+(el.dataset.sub?'／'+el.dataset.sub:''),qty:q,price,subtotal:q*price})}});localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));const bonus=Math.floor(total/3000),remaining=total%3000===0?3000:3000-total%3000;document.getElementById('total-price').textContent='¥'+total.toLocaleString();document.getElementById('cart-count').textContent=count;document.getElementById('bonus-count').textContent=bonus;document.getElementById('next-bonus').textContent='（あと ¥'+remaining.toLocaleString()+'）';document.getElementById('summary-total-price').textContent='¥'+total.toLocaleString();document.getElementById('summary-bonus-count').textContent=bonus;window.currentCart=cart;renderCart();renderSummary(cart,total,bonus)}
function renderCart(){
 const body=document.getElementById('cart-modal-body');const cart=window.currentCart||[];
 if(!cart.length){body.innerHTML='<p style="text-align:center;color:#64748b">商品が選択されていません。</p>';return}
 const randomNames=['缶バッジ','トレカ（2枚入）'];
 const normal=cart.filter(x=>!['sets','singles'].includes(x.key.split('|')[0]));
 const row=x=>`<div class="cart-check-item ${checkedItemKeys.has(x.key)?'done':''}"><input class="cart-checkbox" type="checkbox" ${checkedItemKeys.has(x.key)?'checked':''} onchange="toggleChecked('${encodeURIComponent(x.key)}',this.checked)"><div class="cart-item-info"><div class="cart-item-title">${x.name}</div><div class="cart-item-sub">${x.qty}点 × ¥${x.price.toLocaleString()} = ¥${x.subtotal.toLocaleString()}</div></div></div>`;
 let html=normal.map(row).join('');
 randomNames.forEach(name=>{
  const set=cart.find(x=>x.key===`sets|${name}|`),single=cart.find(x=>x.key===`singles|${name}|`);
  if(!set&&!single)return;
  const sets=set?set.qty:0,singles=single?single.qty:0,qty=sets*10+singles,cost=(set?set.subtotal:0)+(single?single.subtotal:0);
  html+=`<div class="item-card"><div class="item-name">${name}</div><div class="cart-item-sub">合計 ${qty}／30個・¥${cost.toLocaleString()}</div>`;
  if(set)html+=row({...set,name:'10パックセット（10個分）'});
  else html+=`<div class="cart-item-sub">10パックセット：0セット × ¥5,500 = ¥0</div>`;
  if(single)html+=row({...single,name:'バラ売り'});
  else html+=`<div class="cart-item-sub">バラ売り：0個 × ¥550 = ¥0</div>`;
  html+='</div>';
 });
 body.innerHTML=html;
}
function toggleChecked(key,checked){key=decodeURIComponent(key);if(checked)checkedItemKeys.add(key);else checkedItemKeys.delete(key);localStorage.setItem(CHECK_KEY,JSON.stringify([...checkedItemKeys]));renderCart()}
function openCartModal(){renderCart();document.getElementById('cart-modal').classList.add('open')}function closeCartModal(){document.getElementById('cart-modal').classList.remove('open')}
function renderSummary(cart,total,bonus){
 const byCategory=category=>cart.filter(x=>x.key.split('|')[0]===category);
 const chars=byCategory('chars'), open=byCategory('open'), sets=byCategory('sets'), singles=byCategory('singles');
 const table=rows=>`<table class="summary-table">${rows.map(x=>`<tr><td>${x.label||x.name}</td><td class="qty">${x.qtyLabel!==undefined?x.qtyLabel:'×'+x.qty}</td><td class="subtotal">¥${x.subtotal.toLocaleString()}</td></tr>`).join('')}</table>`;
 const section=(title,content)=>`<div class="summary-group-hdr">${title}</div>${content}`;
 let html='';
 const irokaNames=['マトリ・都築兄弟','警視庁・九条家','Revel・瀬尾研究室'];
 const iroka=open.filter(x=>irokaNames.includes(x.name));
 const calendar=open.filter(x=>x.name==='2027卓上カレンダー');
 const otherOpen=open.filter(x=>!irokaNames.includes(x.name)&&x.name!=='2027卓上カレンダー');
 const openRows=[];
 chars.forEach(x=>openRows.push({...x,label:x.name}));
 iroka.forEach(x=>openRows.push({...x,label:'イラカ／'+x.name}));
 calendar.forEach(x=>openRows.push({...x,label:'カレンダー'}));
 otherOpen.forEach(x=>openRows.push({...x,label:x.name}));
 if(openRows.length) html+=section('オープン商品',table(openRows));
 [['缶バッジ','缶バッジ／ランダム'],['トレカ（2枚入）','トレカ／ランダム']].forEach(([name,title])=>{
   const set=sets.find(x=>x.name===name), single=singles.find(x=>x.name===name);
   const setQty=set?set.qty:0, singleQty=single?single.qty:0, qty=setQty*10+singleQty;
   if(!qty)return;
   const cost=(set?set.subtotal:0)+(single?single.subtotal:0);
   const rows=[
    {label:'パック',qtyLabel:`${setQty}セット × ¥5,500`,subtotal:setQty*5500},
    {label:'バラ売り',qtyLabel:`${singleQty}個 × ¥550`,subtotal:singleQty*550},
    {label:`合計：${qty}／30個`,qtyLabel:'',subtotal:cost}
   ];
   html+=section(title,table(rows));
 });
 document.getElementById('summary-content').innerHTML=html||'<p style="text-align:center">商品未選択</p>';
}
function resetAll(){if(!confirm('選択内容をすべてリセットしますか？'))return;document.querySelectorAll('input[data-category]').forEach(el=>el.value=0);checkedItemKeys.clear();localStorage.removeItem(CHECK_KEY);calculateTotal()}
async function generateImage(){const card=document.getElementById('summary-card');card.style.display='block';try{if(!window.html2canvas){alert('画像保存ライブラリの読み込みに失敗しました。通信環境を確認してください。');return}const canvas=await html2canvas(card,{scale:2,backgroundColor:'#ffffff'});const a=document.createElement('a');a.download='スタマイ_AGF2026_購入リスト.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('画像の作成に失敗しました。もう一度お試しください。')}finally{card.style.display='none'}}
render();
</script></body></html>
